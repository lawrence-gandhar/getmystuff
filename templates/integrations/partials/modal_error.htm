{# Modal body for a form that could not be loaded (deleted row, wrong owner).
   Rendered into the same .modal-content target as the form itself, so the reason lands
   inside the dialog somebody just opened instead of a blank shell or a raw error page. #}
<div class="modal-header border-bottom">
    <h5 class="modal-title text-danger">
        <i class="las la-exclamation-circle"></i> Could not open
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
    <div class="alert alert-danger mb-0">{{ error }}</div>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
</div>
