{# HTMX response for every template mutation: the inline error (or a success marker
   the modal's after-request hook closes itself on) plus an out-of-band refresh of
   the templates table. #}
{% if error %}
<div class="alert alert-danger" data-success="false">{{ error }}</div>
{% else %}
<div data-success="true"></div>
{% endif %}
{% include "email_dispatch/partials/template_table.htm" %}
