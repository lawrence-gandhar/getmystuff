{# HTMX response for every SMTP server mutation: the inline error (or a success
   marker the modal's after-request hook closes itself on) plus an out-of-band
   refresh of the servers table. #}
{% if error %}
<div class="alert alert-danger" data-success="false">{{ error }}</div>
{% else %}
<div data-success="true"></div>
{% endif %}
{% include "email_dispatch/partials/smtp_table.htm" %}
