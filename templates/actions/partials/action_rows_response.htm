{# HTMX response for every library mutation: inline error (or success marker) into
   the response target, plus an out-of-band swap of the actions table body. #}
{% if error %}
<div class="alert alert-danger py-2 small mb-0" data-success="false">
    <i class="las la-exclamation-circle"></i> {{ error }}
</div>
{% else %}
<div data-success="true"></div>
{% endif %}
<tbody id="actionsTableBody" hx-swap-oob="true">
{% include "actions/partials/action_rows_body.htm" %}
</tbody>
