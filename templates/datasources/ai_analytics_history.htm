{% if entries %}
<div class="list-group list-group-flush">
    {% for e in entries %}
    <div class="list-group-item px-0 py-2">
        <div class="d-flex justify-content-between align-items-start gap-2">
            <span class="fw-semibold small text-truncate">
                <i class="las la-comment-dots text-muted"></i> {{ e.prompt }}
            </span>
            {% if e.created_at %}
            <span class="text-muted small text-nowrap">{{ e.created_at.strftime('%b %d, %H:%M') }}</span>
            {% endif %}
        </div>
        {% if e.status == "success" %}
        <p class="small text-muted mb-0 mt-1">{{ e.summary }}</p>
        {% else %}
        <p class="small text-danger mb-0 mt-1">
            <i class="las la-exclamation-circle"></i> {{ e.error_message }}
        </p>
        {% endif %}
    </div>
    {% endfor %}
</div>
{% else %}
<p class="text-muted small text-center py-3 mb-0">
    <i class="las la-history fs-5 d-block mb-1"></i> No previous AI analyses yet.
</p>
{% endif %}
