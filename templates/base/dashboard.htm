{% extends "base/layout.htm" %}
{% block title %}
Dashboard | GetMyStuff
{% endblock %}


{% block content %}
<!-- DASHBOARD CONTENT -->
<div class="container dashboard-container">

    <div class="row g-4">

        <div class="col-md-4">
            <div class="dashboard-card">
                <div class="card-icon mb-3">
                    <i class="las la-chart-line"></i>
                </div>
                <h5>Analytics</h5>
                <p class="text-muted">View performance metrics and reports.</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="dashboard-card">
                <div class="card-icon mb-3">
                    <i class="las la-box"></i>
                </div>
                <h5>My Items</h5>
                <p class="text-muted">Manage and track your stored items.</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="dashboard-card">
                <div class="card-icon mb-3">
                    <i class="las la-box"></i>
                </div>
                <h5>Settings</h5>
                <p class="text-muted">Manage settings.</p>
            </div>
        </div>

    </div>

</div>

{% endblock %}
