<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }} | GetMyStuff</title>
<link rel="icon" type="image/png" href="/static/images/favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/line-awesome/1.3.0/line-awesome/css/line-awesome.min.css" rel="stylesheet">

<!-- STATIC CSS -->
<link href="/static/css/base.css" rel="stylesheet"> 
<link href="/static/css/login.css" rel="stylesheet">

</head>
<body>

<div class="login-card text-center">
    
    <div class="mb-4">
        <div class="brand-logo">
            <i class="las la-box-open"></i> Get<span>MyStuff</span>
        </div>
        <p class="small mt-2">Welcome back! Please login to your account.</p>
    </div>

    <form method="post" action="/auth/login">
        <div class="mb-3">
            <div class="input-group">
                <span class="input-group-text"><i class="las la-envelope"></i></span>
                <input type="email" name="email" class="form-control" placeholder="Email address" required>
            </div>
        </div>

        <div class="mb-3">
            <div class="input-group">
                <span class="input-group-text"><i class="las la-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3 extra-links">
            <div>
                <input type="checkbox" id="remember">
                <label for="remember" class="small">Remember me</label>
            </div>
            <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-login w-100">
            <i class="las la-sign-in-alt"></i> Login
        </button>

        <div class="mt-4 extra-links">
            <p class="small">Don't have an account? <a href="#">Sign up</a></p>
        </div>
    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
