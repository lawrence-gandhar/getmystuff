{# Response for toggle-active/delete: any error message goes into the page-level
   response target the row buttons point at, plus an out-of-band refresh of the
   API keys table. #}
{% if error %}
<div class="alert alert-danger alert-dismissible fade show mb-3" data-success="false">
    {{ error }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{% else %}
<div data-success="true"></div>
{% endif %}
{% include "ai_settings/keys_table.htm" %}
